# Cloudflare Workers static site configuration
# https://developers.cloudflare.com/workers/static-assets/

name = "noagendanomeeting-net"
compatibility_date = "2026-04-05"
# Serve only on the custom domain so *.workers.dev copies aren't indexed.
workers_dev = false
preview_urls = false

# Bind the apex here rather than in the dashboard, so every deploy (Workers
# Builds or `npm run deploy`) asserts it and the binding lives with the code.
routes = [{ pattern = "noagendanomeeting.net", custom_domain = true }]

[build]
command = "npm install && npm run build"

[assets]
directory = "dist"
not_found_handling = "404-page"
